<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication System</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="background-mesh">
        <div class="mesh-blob blob-1"></div>
        <div class="mesh-blob blob-2"></div>
    </div>
    <div class="container auth-container">
        <div class="card glassmorphism auth-card">
            
            <div class="tabs">
                <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Login</button>
                <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Register</button>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="form active">
                <div class="form-header">
                    <h2>Welcome Back</h2>
                    <p>Enter your credentials to access your account</p>
                </div>
                <div class="input-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" placeholder="you@example.com" required>
                </div>
                <div class="input-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary">Sign In</button>
                <div class="form-message" id="login-message"></div>
            </form>

            <!-- Register Form -->
            <form id="register-form" class="form">
                <div class="form-header">
                    <h2>Create Account</h2>
                    <p>Join us today to get started</p>
                </div>
                <div class="input-group">
                    <label for="register-username">Username</label>
                    <input type="text" id="register-username" placeholder="johndoe" required>
                </div>
                <div class="input-group">
                    <label for="register-email">Email</label>
                    <input type="email" id="register-email" placeholder="you@example.com" required>
                </div>
                <div class="input-group">
                    <label for="register-password">Password</label>
                    <input type="password" id="register-password" placeholder="••••••••" required minlength="6">
                </div>
                <button type="submit" class="btn btn-primary">Sign Up</button>
                <div class="form-message" id="register-message"></div>
            </form>

            <!-- Verification Section (Initially Hidden) -->
            <div id="verify-section" class="form">
                <div class="form-header">
                    <h2>Verify Your Email</h2>
                    <p>We've sent a 6-digit code to <span id="display-verify-email" style="font-weight: 600; color: var(--primary);"></span></p>
                </div>
                <div class="input-group">
                    <label for="verify-code">Verification Code</label>
                    <input type="text" id="verify-code" placeholder="123456" maxlength="6" style="text-align: center; letter-spacing: 8px; font-size: 1.5rem; font-weight: bold;">
                </div>
                <button type="button" id="btn-verify-code" class="btn btn-primary">Verify Account</button>
                <div style="text-align: center; margin-top: 15px;">
                    <button type="button" id="btn-resend-code" style="background: none; border: none; color: var(--text-muted); cursor: pointer; text-decoration: underline; font-size: 0.85rem;">Resend Code</button>
                </div>
                <div class="form-message" id="verify-message"></div>
                <div style="text-align: center; margin-top: 10px;">
                    <a href="#" onclick="switchTab('login')" style="font-size: 0.85rem; color: var(--primary); text-decoration: none;">Back to Login</a>
                </div>
            </div>

        </div>
    </div>

    <script src="/app-config.js?v=1"></script>
    <script src="/js/app.js?v=2.1"></script>
</body>
</html>
